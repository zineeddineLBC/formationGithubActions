
name: Demo GitHub Actions Workflow

on:
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  build:cd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: .

  execute:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build

      - name: Execute application
        run: node index.js

  deploy:
    runs-on: ubuntu-latest
    needs: execute
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy using pinned action
        uses: azure/webapps-deploy@2f3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u # Example commit SHA
        with:
          app-name: "demo-app"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
