
name: CI

on:
  push:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy

      - name: Lint (flake8)
        run: flake8 --max-line-length=120 --statistics

      - name: Static type checks (mypy)
        run: mypy .

  test:
    name: Unit Tests (Python 3.11 only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov


      - name: Run tests (pass if no tests are found)
        run: |
          set -e
          pytest --maxfail=1 --disable-warnings --exitfirst --strict-markers -q || rc=$?
          if [ "${rc:-0}" -eq 5 ]; then
            echo "ℹ️ No tests were collected. Continuing without failing."
            exit 0
          else
            exit "${rc:-0}"
          fi


  upload-logs:
    name: Upload Logs
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - name: Create log file
        run: |
          echo "CI Pipeline Logs" > pipeline_logs.txt
          echo "Date: $(date)" >> pipeline_logs.txt
          echo "Commit: $GITHUB_SHA" >> pipeline_logs.txt
          echo "Branch: $GITHUB_REF" >> pipeline_logs.txt
          echo "--- Lint & Test Summary ---" >> pipeline_logs.txt
          echo "Lint completed successfully." >> pipeline_logs.txt
          echo "Tests executed (errors ignored)." >> pipeline_logs.txt

      - name: Upload log file
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: pipeline_logs.txt
