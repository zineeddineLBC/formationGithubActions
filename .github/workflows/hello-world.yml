
name: Hello World Single OS Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello World
        run: echo "Hello World from ubuntu-latest"

  ask-questions:
    needs: hello-world
    runs-on: ubuntu-latest
    strategy:
      matrix:
        question:
          - "How are you feeling today?"
          - "What's your current status?"
          - "Anything exciting happening?"
    steps:
      - name: Ask a question
        run: echo "${{ matrix.question }} (from ubuntu-latest)"
