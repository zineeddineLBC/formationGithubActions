
name: Pipeline to correct

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch:    

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy

      - name: Lint (flake8)
        run: flake8 --max-line-length=120 --statistics

      - name: Static type checks (mypy)
        run: mypy .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings -q

  upload-logs:
    name: Upload Logs
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - name: Create log file
        run: |
          echo "CI Pipeline Logs" > pipeline_logs.txt
          echo "Date: $(date)" >> pipeline_logs.txt
          echo "Commit: $GITHUB_SHA" >> pipeline_logs.txt
          echo "Branch: $GITHUB_REF" >> pipeline_logs.txt
          echo "--- Lint & Test Summary ---" >> pipeline_logs.txt
          echo "Lint and tests completed successfully." >> pipeline_logs.txt

      - name: Upload log file
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs